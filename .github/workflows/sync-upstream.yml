name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨 3 点自动同步
  workflow_dispatch:       # 也支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/rohitg00/ai-engineering-from-scratch.git
          git fetch upstream

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit || echo "No changes to merge"

      - name: Build site
        run: node site/build.js

      - name: Push changes
        run: git push origin main || echo "No new changes to push"